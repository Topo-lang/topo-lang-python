name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the upstream topo-core / topo-lang refs this build is tested against.
  # Bump whenever a new compatible tag ships. TOPO_CLI_REF pins the
  # downstream topo-cli checkout the verify-l2 job builds for its
  # TopoCheckRunner export (checker-e2e suite link dependency).
  TOPO_CORE_REF: main
  TOPO_LANG_REF: main
  TOPO_CLI_REF: main

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up Python 3 (for extractor + extractor-smoke suites)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Windows: debugpy must be importable under the SAME interpreter the
      # Configure step probes (TOPO_DEBUG_PYTHON_HAS_DEBUGPY) — otherwise the
      # launcher silently degrades to the stdlib pdb fallback and the
      # real-adapter e2e below would pass vacuously. Must precede Configure.
      - name: Install debugpy (Windows real-adapter e2e)
        if: runner.os == 'Windows'
        run: python -m pip install debugpy

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Matches the `builtin-baseline` pinned in vcpkg.json. Bump both
          # together when refreshing the vcpkg snapshot.
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      # Cache the upstream Topo install (topo-core + topo-lang) so PRs
      # don't re-build them every time. Keyed on the two pinned refs so
      # bumping invalidates the cache.
      - name: Cache upstream topo install
        id: topo-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/topo-install
          key: topo-core-${{ env.TOPO_CORE_REF }}-lang-${{ env.TOPO_LANG_REF }}-${{ matrix.os }}-v5

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_ENABLE_LLVM=OFF
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      # Re-install topo-core to flip TOPO_CORE_WITH_LANG ON now that
      # topo-lang is discoverable in the prefix. This wires lib/Build +
      # lib/Transpile into the topo-core install set.
      - name: Re-install topo-core (with-lang)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Configure topo-lang-python
        run: |
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LANG_PYTHON_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          # Windows: the input-trust suite spawns the MinGW-linked
          # topo-build-python.exe; a stale libstdc++-6.dll earlier on PATH makes
          # it fail to load (0xC0000139). Put the build-time gcc bin dir FIRST so
          # the matching runtime resolves; the spawned child inherits this PATH.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cxx=$(grep -m1 '^CMAKE_CXX_COMPILER:' build/CMakeCache.txt | cut -d= -f2)
            if [ -n "$cxx" ]; then
              export PATH="$(cygpath -u "$(dirname "$cxx")"):${PATH}"
            fi
          fi
          ctest --test-dir build --output-on-failure --timeout 120

      # ── Real debug-adapter e2e (Windows) ───────────────────────────
      # One REAL debug-adapter round-trip on a Windows CI surface (the
      # remaining acceptance bullet of the reproc-hang issue): topo-debug
      # drives the debugpy DAP adapter — the .cmd launcher generated at
      # Configure time — against the staged tiny_vector fixture. Asserting
      # the pdb-fallback notice is ABSENT is what makes this a real-adapter
      # proof: the query also succeeds through the stdlib pdb fallback, so
      # a green 32.0 alone would be vacuous. Reuses the MinGW PATH fix from
      # the Test step above (the spawned .exe + python chain inherit it).
      - name: Real debug-adapter e2e (topo-debug + debugpy)
        if: runner.os == 'Windows'
        run: |
          cxx=$(grep -m1 '^CMAKE_CXX_COMPILER:' build/CMakeCache.txt | cut -d= -f2)
          if [ -n "$cxx" ]; then
            export PATH="$(cygpath -u "$(dirname "$cxx")"):${PATH}"
          fi
          out=$(mktemp)
          "${RUNNER_TEMP}/topo-install/bin/topo-debug.exe" query "sum(vec)" \
              --break tiny_vector.py:15 \
              --adapter "$(cygpath -m "$PWD/build/topo-debug/topo-debug-python.cmd")" \
              --target "$(cygpath -m "$PWD/build/topo-debug/test/fixtures/tiny_vector.py")" \
              >"$out" 2>&1
          cat "$out"
          grep -Eq '^32(\.0+)?[[:space:]]*$' "$out" \
              || { echo "::error::debugpy e2e: unexpected query output (want 32.0)"; exit 1; }
          if grep -q "falling back to stdlib pdb" "$out"; then
            echo "::error::debugpy e2e ran through the stdlib pdb fallback — not a real-adapter proof"
            exit 1
          fi

      # Smoke test: install topo-lang-python, then verify a downstream
      # find_package(topo-lang-python CONFIG REQUIRED) resolves and links
      # cleanly against the topo::lang-python::TopoPythonAnalysis target.
      - name: Install topo-lang-python
        run: cmake --install build --prefix "${RUNNER_TEMP}/lang-python-install"

      - name: find_package smoke
        run: |
          mkdir -p "${RUNNER_TEMP}/find-package-smoke"
          cd "${RUNNER_TEMP}/find-package-smoke"
          cat > vcpkg.json <<'JSON'
          {
            "name": "topo-lang-python-smoke",
            "version-string": "0.0.1",
            "builtin-baseline": "56bb2411609227288b70117ead2c47585ba07713",
            "dependencies": ["nlohmann-json", "tomlplusplus"]
          }
          JSON
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(lang-python-find-package-smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(topo-lang-python CONFIG REQUIRED)
          add_executable(smoke smoke.cpp)
          target_link_libraries(smoke PRIVATE topo::lang-python::TopoPythonAnalysis)
          # MinGW on GHA: cached upstream topo-install was linked against
          # a different libstdc++ ABI than C:\mingw64\bin currently
          # provides, so the dynamically-linked smoke binary either
          # segfaults or fails at startup. Static-link runtime so the
          # downstream binary is hermetic.
          if(MINGW)
              target_link_options(smoke PRIVATE -static -static-libgcc -static-libstdc++)
          endif()
          CMAKE
          cat > smoke.cpp <<'CPP'
          #include "stub/PythonStubGenerator.h"
          #include <cstdio>
          int main() {
              topo::check::PythonStubGenerator gen;
              auto result = gen.stubFunction("/nonexistent/path.py", "missing_fn");
              std::printf("topo-lang-python find_package OK: stub success=%d\n",
                          result.success ? 1 : 0);
              return 0;
          }
          CPP
          cmake -S . -B build -G Ninja \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/lang-python-install;${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build
          ./build/smoke

  # ── Checker-e2e + L2 deep-containment verify (pyright) ───────────
  # build-and-test (above) never builds the checker-e2e suite: it links
  # TopoCheckRunner, exported by topo-cli — a package downstream of this
  # one — so the default matrix carries no reason to build it. This job
  # adds that surface on one platform: topo-cli's only upstreams
  # (topo-core + topo-lang) are the same prefix the default job already
  # builds, so one extra build+install step unlocks the suite. pyright is
  # installed so the PythonContainment.Deep* L2 cases exercise the real
  # PyrightBridge + PythonSafetyAnalyzer path — with pyright absent the
  # runner's no-silent-degradation guard forces a non-zero verdict and
  # the Deep cases FAIL (they never skip). The final step re-runs the
  # suite and converts any skip or zero-pass into a hard failure,
  # mirroring the all-skip→fail guard in topo-lsp's CI.
  verify-l2:
    name: verify (checker e2e + pyright L2) (ubuntu-24.04)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Set up Python 3 (extractor scripts + the L2 ast subprocess path)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js 22 (pyright host)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # pyright ships the pyright-langserver binary PyrightBridge probes
      # for; npm -g puts it on PATH (unlike pip --user's ~/.local/bin).
      # Same recipe topo-lsp's CI proves on this runner image.
      - name: Install pyright (PyrightBridge host server)
        run: |
          npm i -g pyright
          command -v pyright-langserver

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      # Same key as build-and-test's ubuntu leg — this job consumes the
      # identical upstream install (topo-cli goes to a separate, uncached
      # prefix below, so the cached content is unchanged).
      - name: Cache upstream topo install
        id: topo-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/topo-install
          key: topo-core-${{ env.TOPO_CORE_REF }}-lang-${{ env.TOPO_LANG_REF }}-ubuntu-24.04-v6

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_ENABLE_LLVM=OFF
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      - name: Re-install topo-core (with-lang)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      # The functional-e2e suite spawns topo-build → topo-check, and the
      # spawned topo-check needs the Python plugin IN-PROCESS to check the
      # python fixtures — so topo-cli (below) must find this repo's package
      # at configure time. Lib-only install of the PR's own checkout.
      - name: Build & install topo-lang-python (lib only)
        run: |
          cmake -S . -B "${RUNNER_TEMP}/lang-python-lib-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/lang-python-install" \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LANG_PYTHON_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/lang-python-lib-build" --target install

      # Uncached on purpose: topo-cli is a thin router + small static lib
      # (minutes to build with the vcpkg binary cache), and an always-fresh
      # build tracks its main without a second cache key to bump. The python
      # plugin auto-detects ON from the lang-python prefix (the spawned
      # topo-check must check python in-process — see above); the other
      # plugins stay OFF. The checker-e2e suite still links only the
      # TopoCheckRunner static lib and registers this repo's plugin itself
      # via TestMain. Profile CLI off: it would pull topo-v8 into the
      # installed config's find_dependency chain.
      - name: Build & install topo-cli (TopoCheckRunner export, python plugin)
        run: |
          git clone --depth 1 --branch "${TOPO_CLI_REF}" \
              https://github.com/topo-lang/topo-cli.git \
              "${RUNNER_TEMP}/topo-cli-src"
          cmake -S "${RUNNER_TEMP}/topo-cli-src" \
                -B "${RUNNER_TEMP}/topo-cli-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-cli-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${RUNNER_TEMP}/lang-python-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_CLI_ENABLE_PROFILE=OFF
          cmake --build "${RUNNER_TEMP}/topo-cli-build" --target install

      - name: Configure topo-lang-python (tests ON, topo-cli on the prefix)
        run: |
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${RUNNER_TEMP}/topo-cli-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DTOPO_LANG_PYTHON_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run checker-e2e suite
        run: |
          # --no-tests=error: if the topo-cli gate silently failed and the
          # checker suite was never registered, the job FAILS rather than
          # greening on zero tests.
          ctest --test-dir build -L checker --output-on-failure --timeout 180 --no-tests=error

      - name: Run functional e2e suite
        run: |
          # --no-tests=error: the functional gate must have compiled the
          # suite (installed topo-cli present on the prefix); FAIL rather
          # than green on zero tests.
          ctest --test-dir build -L functional --output-on-failure --timeout 120 --no-tests=error

      # The checker suite passes ctest even when its gtest cases skip —
      # "Passed" can mean "every case skipped". Re-run the binaries via the
      # shared assert script: strict mode keeps the aggregate guards
      # (exit 0, >=1 pass, ZERO skips), and the NAMED anchor cases — the
      # pyright-backed L2 deep-containment path — must additionally appear
      # in the PASSED set. An ABSENT name means renamed / filtered / not
      # compiled in; update the list together with the test, never weaken
      # the pattern. The functional suite is re-run under the same
      # aggregate guards (it carries no skip paths today).
      - name: Assert L2 deep containment ran (skip != pass)
        run: |
          bash .github/scripts/assert-live-cases.sh strict topo-lang-python-check-tests \
            PythonContainment.DeepOsFile \
            PythonContainment.DeepExternalOk \
            PythonContainment.DeepWildcardImportOs \
            PythonContainment.DeepClassPunning
          bash .github/scripts/assert-live-cases.sh strict topo-lang-python-functional-tests
